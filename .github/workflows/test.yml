name: test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q
  kindle-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BusyBox ash syntax check
        run: |
          for f in kindle/device/*/bin/*.sh kindle/scriptlets/*.sh kindle/*.sh; do
            docker run --rm -v "$PWD":/w busybox:1.36 sh -n "/w/$f" && echo "ok $f"
          done
